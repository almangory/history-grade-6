<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1335"/>
      <stop offset="50%" stop-color="#121020"/>
      <stop offset="100%" stop-color="#080710"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Pyramid Gradient Left -->
    <linearGradient id="pyrLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Pyramid Gradient Right (Shaded) -->
    <linearGradient id="pyrRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Nile Wave Gradient -->
    <linearGradient id="nileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background with Rounded Squircle Shape for Mobile Apps -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Glowing Sun / Crescent in the Background -->
  <circle cx="256" cy="180" r="100" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
  <circle cx="256" cy="175" r="70" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Historical Islamic Arch Outline -->
  <path d="M 120 340 L 120 220 Q 120 120 256 90 Q 392 120 392 220 L 392 340" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- Sudan Nubian Pyramids of Meroe (Iconic Steep Angle) -->
  <!-- Left Side Pyramid (Smaller) -->
  <polygon points="175,185 140,310 175,310" fill="url(#pyrLeft)" opacity="0.9"/>
  <polygon points="175,185 175,310 205,310" fill="url(#pyrRight)" opacity="0.9"/>

  <!-- Right Side Pyramid (Smaller) -->
  <polygon points="335,185 305,310 335,310" fill="url(#pyrLeft)" opacity="0.9"/>
  <polygon points="335,185 335,310 370,310" fill="url(#pyrRight)" opacity="0.9"/>

  <!-- Main Central Pyramid of Meroe -->
  <polygon points="256,135 200,310 256,310" fill="url(#pyrLeft)"/>
  <polygon points="256,135 256,310 312,310" fill="url(#pyrRight)"/>

  <!-- River Nile Waves at the Base -->
  <path d="M 80 340 Q 160 325 256 340 T 432 340 L 432 355 Q 340 370 256 355 T 80 355 Z" fill="url(#nileGrad)" opacity="0.85"/>

  <!-- Open History Manuscript / Book at the Bottom -->
  <g transform="translate(106, 310)">
    <!-- Book Base / Cover -->
    <path d="M 150 45 Q 75 25 15 35 L 5 105 Q 75 90 150 115 Q 225 90 295 105 L 285 35 Q 225 25 150 45 Z" fill="#451a03" stroke="#b45309" stroke-width="4"/>

    <!-- Book Left Page -->
    <path d="M 150 42 Q 80 20 18 32 L 10 98 Q 80 82 150 108 Z" fill="#fef3c7"/>
    <!-- Book Right Page -->
    <path d="M 150 42 Q 220 20 282 32 L 290 98 Q 220 82 150 108 Z" fill="#fffbeb"/>

    <!-- Central Spine Gold Line -->
    <line x1="150" y1="42" x2="150" y2="108" stroke="#d97706" stroke-width="4"/>

    <!-- Text Lines on Left Page -->
    <line x1="38" y1="48" x2="130" y2="44" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="35" y1="62" x2="130" y2="58" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="32" y1="76" x2="125" y2="72" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Text Lines on Right Page -->
    <line x1="170" y1="44" x2="262" y2="48" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="170" y1="58" x2="265" y2="62" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="175" y1="72" x2="268" y2="76" stroke="#92400e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Central Gold Emblem Ribbon -->
    <polygon points="150,108 140,140 150,132 160,140" fill="#f59e0b"/>
  </g>

  <!-- Shining Stars / Sparkles of Knowledge -->
  <g fill="#ffe270">
    <!-- Top Left Star -->
    <path d="M 95 140 Q 95 155 80 155 Q 95 155 95 170 Q 95 155 110 155 Q 95 155 95 140 Z"/>
    <!-- Top Right Star -->
    <path d="M 417 140 Q 417 155 402 155 Q 417 155 417 170 Q 417 155 432 155 Q 417 155 417 140 Z"/>
    <!-- Center Top Small Star -->
    <path d="M 256 50 Q 256 60 246 60 Q 256 60 256 70 Q 256 60 266 60 Q 256 60 256 50 Z"/>
  </g>

  <!-- Number 6 Badge in Arabic (٦) in Gold Circle -->
  <circle cx="256" cy="460" r="28" fill="url(#goldGrad)" stroke="#121020" stroke-width="4"/>
  <text x="256" y="471" font-family="'Cairo', 'Amiri', 'Traditional Arabic', serif" font-size="28" font-weight="900" fill="#121020" text-anchor="middle">٦</text>
</svg>
